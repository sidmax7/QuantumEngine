[workspace]
resolver = "2"
members = [
    "crates/jbl-quantum",
    "crates/quantumengine-dbus",
    "crates/quantumenginectl",
    "crates/quantumengined",
    "crates/quantumengine",
]

[workspace.package]
version = "0.4.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sidmax7/QuantumEngine"
rust-version = "1.88"

[workspace.dependencies]
jbl-quantum = { path = "crates/jbl-quantum", version = "0.4.8" }
quantumengine-dbus = { path = "crates/quantumengine-dbus", version = "0.4.8" }
zbus = "5"
