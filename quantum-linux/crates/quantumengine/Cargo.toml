[package]
name = "quantum-gui"
description = "Desktop control panel for JBL Quantum 810 Wireless headsets on Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# egui needs a newer compiler than the library and CLI do.
rust-version = "1.88"

[dependencies]
jbl-quantum.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
serde = { version = "1", features = ["derive"] }
